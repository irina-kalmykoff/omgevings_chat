[project]
name = "omgkg"
version = "0.1.0"
description = "Knowledge graphs for reliable legal RAG over the Omgevingswet (research prototype for OmgevingsChat)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Dimitar Zhivkov" },
    { name = "Irina Kalmykova" },
    { name = "Jan Nguyen" },
    { name = "Jesse Visser" },
    { name = "Juan Fernández Valencia" },
    { name = "Noah Janssen" },
    { name = "Rafał Dorsz" },
]
requires-python = ">=3.11"
dependencies = [
    "lxml>=6.1.3",
    "neo4j>=6.4.0",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "lefthook>=2.1.17",
    "mypy>=2.4.0",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# Tasks — the Python counterpart of the OmgevingsChat monorepo's package.json
# scripts. CI (GitHub Actions and Bitbucket Pipelines) runs `uv run poe check`.
# ---------------------------------------------------------------------------

[tool.poe.tasks]
lint = { cmd = "ruff check", help = "Lint with ruff" }
"lint:fix" = { cmd = "ruff check --fix", help = "Lint and apply safe fixes" }
format = { cmd = "ruff format", help = "Format with ruff" }
"format:check" = { cmd = "ruff format --check", help = "Check formatting without writing" }
typecheck = { cmd = "mypy", help = "Type-check with mypy (strict on src/)" }
test = { cmd = "pytest", help = "Run the test suite (network disabled)" }

[tool.poe.tasks.check]
help = "Everything CI runs: lint, format check, types, tests"
sequence = ["lint", "format:check", "typecheck", "test"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
# The concept demonstrator is kept as-is until it is ported into src/omgkg.
# Code blocks in Markdown are illustrative sketches, not code to format.
extend-exclude = ["prototype", "*.md"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    # Tests never touch the network: no live DSO API calls, local data only.
    "--disable-socket",
    "--allow-unix-socket",
]
xfail_strict = true
