<title>Maastricht Rule Graph</title>
<style>
  /* layout: full-bleed graph canvas under a compact title + control strip */
  :root{
    --bg:#fcfcfb; --surface:#ffffff; --ink:#1b2430; --muted:#5b6572; --line:#d9dee5;
    --art:#2f6db0; --act:#1a9b8a; --warn:#c77d1e; --dim:0.16;
    --serif:'Spectral',Georgia,'Times New Roman',serif;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#111621; --surface:#1a2130; --ink:#e7ecf3; --muted:#9aa7b6; --line:#2c3545;
    --art:#6aa6e0; --act:#4fc9b7; --warn:#e6b24d; --dim:0.14; color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#111621; --surface:#1a2130; --ink:#e7ecf3; --muted:#9aa7b6; --line:#2c3545;
    --art:#6aa6e0; --act:#4fc9b7; --warn:#e6b24d; --dim:0.14; color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);margin:0}
  .wrap{min-height:100%;display:flex;flex-direction:column}
  header{padding-block:18px;padding-inline:20px;border-bottom:1px solid var(--line);
    display:flex;flex-direction:column;gap:12px}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(20px,3vw,27px);margin:0;
    letter-spacing:-.01em;text-wrap:balance}
  .sub{margin:0;color:var(--muted);font-size:14px;max-width:70ch;line-height:1.45}
  .controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{appearance:none;border:0;background:var(--surface);color:var(--muted);
    font:inherit;font-size:13px;font-weight:600;padding:8px 14px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--art);color:#fff}
  :root[data-theme="dark"] .seg button[aria-pressed="true"],
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0c1118}}
  .legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:var(--muted);align-items:center}
  .key{display:inline-flex;align-items:center;gap:7px}
  .dot{width:12px;height:12px;border-radius:50%}
  .dot.art{background:var(--art)} .dot.act{background:var(--act)}
  .ln{width:22px;height:0;border-top:2px solid var(--muted)}
  .ln.dash{border-top-style:dashed}
  .stage{position:relative;flex:1;min-height:60vh}
  svg{display:block;width:100%;height:100%}
  .edge{stroke:var(--muted);stroke-opacity:.5;fill:none}
  .edge.dash{stroke-dasharray:4 4;stroke-opacity:.4}
  .node circle,.node path{cursor:grab;stroke:var(--surface);stroke-width:2}
  .label{font-size:11px;fill:var(--ink);font-weight:600;pointer-events:none;
    paint-order:stroke;stroke:var(--bg);stroke-width:3px}
  .caption{padding:14px 20px;border-top:1px solid var(--line);background:var(--surface);
    font-size:13.5px;line-height:1.5;color:var(--ink);min-height:2.6em}
  .caption b{color:var(--warn)}
  .tip{position:absolute;pointer-events:none;max-width:300px;background:var(--surface);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;
    line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,.18);opacity:0;transition:opacity .12s}
  .tip .num{font-family:var(--serif);font-weight:600;color:var(--art);font-size:14px}
  .tip .op{color:var(--ink);margin:3px 0 5px;font-weight:600}
  .tip .tx{color:var(--muted)}
  @media (max-width:520px){header{padding-inline:16px}.caption{padding-inline:16px}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Inter:wght@400;600;700&display=swap">

    <div class="tip" id="tip"></div>
  </div>
  <div class="caption" id="cap"></div>
</div>

const svg = document.getElementById('svg'), tip = document.getElementById('tip'), cap = document.getElementById('cap');
const SVGNS = 'http://www.w3.org/2000/svg';
const byNum = n => GRAPH.nodes.find(d => d.nummer === n);

// the demonstrated story, selected by article number so it is data-driven
const VEC = ['22.27'];                       // what a similarity search for a vergunningvrij dakkapel returns
const CHAIN = ['22.26','22.27','22.28'];     // base rule -> exception -> monument restriction

const nodes = GRAPH.nodes.map(d => ({...d}));
const id2n = Object.fromEntries(nodes.map(n => [n.id, n]));
const links = GRAPH.edges.map(e => ({...e, s: id2n[e.source], t: id2n[e.target]})).filter(l => l.s && l.t);

function size(){ const r = svg.getBoundingClientRect(); W = r.width; H = r.height; }
size();
// seed positions on a circle
nodes.forEach((n,i) => { const a = i/nodes.length*Math.PI*2; n.x = W/2 + Math.cos(a)*Math.min(W,H)*0.3; n.y = H/2 + Math.sin(a)*Math.min(W,H)*0.3; n.vx=0; n.vy=0; });

function tick(){
  const k = 0.02;
  for(const n of nodes){ n.vx += (W/2 - n.x)*k*0.04; n.vy += (H/2 - n.y)*k*0.04; }
  for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
    const a=nodes[i],b=nodes[j]; let dx=a.x-b.x,dy=a.y-b.y; let d2=dx*dx+dy*dy||1; let f=2600/d2;
    const d=Math.sqrt(d2); dx/=d;dy/=d; a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;
  }
  for(const l of links){
    let dx=l.t.x-l.s.x,dy=l.t.y-l.s.y; const d=Math.sqrt(dx*dx+dy*dy)||1; const f=(d-96)*0.012;
    dx/=d;dy/=d; l.s.vx+=dx*f;l.s.vy+=dy*f; l.t.vx-=dx*f;l.t.vy-=dy*f;
  }
  for(const n of nodes){ if(n===drag) continue; n.x+=n.vx*=0.82; n.y+=n.vy*=0.82;
    n.x=Math.max(34,Math.min(W-34,n.x)); n.y=Math.max(34,Math.min(H-34,n.y)); }
}

let edgeEls=[], nodeEls=[], drag=null, mode='vec';
function build(){
  svg.innerHTML=''; edgeEls=[]; nodeEls=[];
  for(const l of links){
    const p=document.createElementNS(SVGNS,'line');
    p.setAttribute('class','edge'+(l.type==='GELDT_VOOR'?' dash':''));
    l.el=p; svg.appendChild(p); edgeEls.push(l);
  }
  for(const n of nodes){
    const gm=document.createElementNS(SVGNS,'g'); gm.setAttribute('class','node');
    let shape;
    if(n.type==='Activiteit'){ shape=document.createElementNS(SVGNS,'path');
      shape.setAttribute('fill','var(--act)'); n.r=7; }
    else { shape=document.createElementNS(SVGNS,'circle');
      shape.setAttribute('fill','var(--art)'); n.r=CHAIN.includes(n.nummer)?13:9;
      shape.setAttribute('r',n.r); }
    gm.appendChild(shape);
    if(n.type==='Artikel'){
      const t=document.createElementNS(SVGNS,'text'); t.setAttribute('class','label');
      t.setAttribute('text-anchor','middle'); t.textContent=n.nummer; n.tx=t; gm.appendChild(t);
    }
    n.shape=shape; n.g=gm; svg.appendChild(gm);
    gm.addEventListener('pointerenter',e=>showTip(e,n));
    gm.addEventListener('pointermove',e=>moveTip(e));
    gm.addEventListener('pointerleave',()=>{tip.style.opacity=0});
    gm.addEventListener('pointerdown',e=>{drag=n;gm.setPointerCapture(e.pointerId);});
    gm.addEventListener('pointerup',e=>{drag=null;});
    gm.addEventListener('pointermove',e=>{ if(drag===n){ const r=svg.getBoundingClientRect();
      n.x=e.clientX-r.left; n.y=e.clientY-r.top; } });
    nodeEls.push(n);
  }
}

function render(){
  for(const l of edgeEls){ l.el.setAttribute('x1',l.s.x);l.el.setAttribute('y1',l.s.y);
    l.el.setAttribute('x2',l.t.x);l.el.setAttribute('y2',l.t.y); }
  for(const n of nodeEls){
    if(n.type==='Activiteit'){ const r=7;
      n.shape.setAttribute('d',`M${n.x} ${n.y-r} L${n.x+r} ${n.y} L${n.x} ${n.y+r} L${n.x-r} ${n.y} Z`);
    } else { n.shape.setAttribute('cx',n.x); n.shape.setAttribute('cy',n.y); }
    if(n.tx){ n.tx.setAttribute('x',n.x); n.tx.setAttribute('y',n.y-n.r-4); }
  }
  applyMode();
}

function lit(){
  if(mode==='vec') return new Set(nodes.filter(n=>VEC.includes(n.nummer)).map(n=>n.id));
  const base=new Set(nodes.filter(n=>CHAIN.includes(n.nummer)).map(n=>n.id));
  for(const l of links){ if(base.has(l.s.id)||base.has(l.t.id)){ base.add(l.s.id); base.add(l.t.id);} }
  return base;
}
function applyMode(){
  const on=lit();
  for(const n of nodeEls){ n.g.style.opacity = on.has(n.id)?1:'var(--dim)'; }
  for(const l of edgeEls){
    const act = on.has(l.s.id)&&on.has(l.t.id);
    l.el.style.stroke = act? 'var(--warn)':'var(--muted)';
    l.el.style.strokeWidth = act?3:1.4;
    l.el.style.strokeOpacity = act?0.95:0.12;
  }
}

function showTip(e,n){ tip.innerHTML = n.type==='Activiteit'
  ? `<div class="op">${n.opschrift}</div><div class="tx">activiteit</div>`
  : `<div class="num">Artikel ${n.nummer}</div><div class="op">${n.opschrift}</div><div class="tx">${n.tekst||''}</div>`;
  tip.style.opacity=1; moveTip(e); }
function moveTip(e){ const r=svg.getBoundingClientRect(); let x=e.clientX-r.left+14,y=e.clientY-r.top+14;
  if(x>W-290)x-=300; tip.style.left=x+'px'; tip.style.top=y+'px'; }

function setMode(m){ mode=m;
  mVec.setAttribute('aria-pressed', m==='vec'); mGraph.setAttribute('aria-pressed', m==='graph');
  cap.innerHTML = m==='vec'
    ? 'Vector search for a <i>vergunningvrije dakkapel</i> surfaces <b>article 22.27</b> — the exceptions to the permit requirement. Read alone, it says: no permit needed.'
    : 'Following the graph edges, <b>22.27</b> sits between <b>22.26</b> (the permit rule it excepts) and <b>22.28</b> — <i>"Inperkingen artikel 22.27 vanwege cultureel erfgoed"</i>, which claws the exception back for a monument. The edge is what keeps the answer correct.';
  applyMode();
}
document.getElementById('mVec').onclick=()=>setMode('vec');
document.getElementById('mGraph').onclick=()=>setMode('graph');

build();
let ticks=0;
function loop(){ for(let i=0;i<2;i++) tick(); render(); if(++ticks<600||drag) requestAnimationFrame(loop); }
window.addEventListener('resize',()=>{size();});
setMode('vec');
loop();
// keep it live for dragging
svg.addEventListener('pointerdown',()=>{ if(ticks>=600){ticks=0;loop();} });
</script>
