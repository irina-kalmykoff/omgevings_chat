# Local services for the Query -> RAG -> KG -> LLM pipeline: `docker compose up -d`.
# Qdrant holds the OmgevingsChat index (RAG; load it with `omgkg import-snapshot`),
# Neo4j holds our knowledge graph (KG; build it with `omgkg build-graph`).
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports: ["6333:6333"]
    volumes: ["qdrant_storage:/qdrant/storage"]

  neo4j:
    image: neo4j:5.26-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      # Local development only; matches .env.example. Never reuse for a shared server.
      NEO4J_AUTH: neo4j/testpassword
      NEO4J_PLUGINS: '["apoc"]'
    volumes: ["neo4j_data:/data"]

volumes:
  # Same name as the `docker run ... -v qdrant_storage:...` in the bridge README,
  # so an index imported before switching to compose is kept.
  qdrant_storage:
    name: qdrant_storage
  neo4j_data:
    name: omgkg_neo4j_data
